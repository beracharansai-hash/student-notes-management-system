<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SNM</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family: 'Inter', sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    #263e8d,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #3b2469,
                    transparent 35%
                ),
                #080d1a;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .container {
            width: 470px;

            max-width: 92%;

            padding: 42px;

            background:
                rgba(15,23,40,.88);

            border:
                1px solid rgba(255,255,255,.09);

            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.45);

            backdrop-filter: blur(25px);
        }

        .logo {
            width: 52px;
            height: 52px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #4f7cff,
                    #7258ff
                );

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: 800;

            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #7f8ba2;

            font-size: 13px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .5px;

            color: #aeb8ca;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,.09);

            background:
                rgba(255,255,255,.045);

            color: white;

            font-family: inherit;

            transition: .25s;
        }

        input:focus {
            outline: none;

            border-color: #4f7cff;

            box-shadow:
                0 0 0 4px rgba(79,124,255,.08);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #4f7cff,
                    #7258ff
                );

            color: white;

            font-weight: 700;

            font-family: inherit;

            cursor: pointer;

            transition: .3s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(79,124,255,.25);
        }

        .bottom {
            text-align: center;

            margin-top: 22px;

            font-size: 12px;

            color: #69758c;
        }

        .bottom a {
            color: #718fff;

            text-decoration: none;
        }

        .bottom a:hover {
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        SN
    </div>

    <h1>
        Create your account
    </h1>

    <div class="subtitle">
        Start organizing your academic workspace.
    </div>

    <form method="POST">

        <label>
            FULL NAME
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label>
            EMAIL ADDRESS
        </label>

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <label>
            PASSWORD
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Sign in
        </a>

    </div>

</div>

</body>
</html>
