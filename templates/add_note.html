<!DOCTYPE html>
<html>
<head>
    <title>Add Note</title>
</head>
<body>

    <h1>Add Note</h1>

    <form method="POST">

        <label>Title:</label>
        <input type="text" name="title" placeholder="Enter title">

        <br><br>

        <label>Notes:</label>
        <textarea name="notes" placeholder="Enter your note"></textarea>

        <br><br>

        <button type="submit">Add Note</button>

    </form>

</body>
</html>
