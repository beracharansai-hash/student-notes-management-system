<!DOCTYPE html>
<html>

<head>

    <title>View Note</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background-image:
            linear-gradient(rgba(240, 248, 255, 0.80), rgba(240, 248, 255, 0.80)),
            url("https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

        /* Header */

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h2 {
            margin: 0;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        /* Note card */

        .note-card {
            background-color: white;
            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* Note title */

        .note-title {
            color: #1f2937;
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Note content */

        .note-content {
            color: #555;
            font-size: 16px;
            line-height: 1.7;

            padding: 20px;

            background-color: #f9fafb;

            border-radius: 6px;

            margin-bottom: 20px;

            white-space: pre-wrap;
        }

        /* Dates */

        .date-info {
            color: #777;
            font-size: 13px;
            margin-bottom: 7px;
        }

        /* Actions */

        .actions {
            margin-top: 30px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            align-items: center;
        }

        /* Links */

        .action-link {
            display: inline-block;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            color: white;

            font-size: 14px;
        }

        /* Edit */

        .edit-btn {
            background-color: #f59e0b;
        }

        .edit-btn:hover {
            background-color: #d97706;
        }

        /* Upload */

        .upload-btn {
            background-color: #16a34a;
        }

        .upload-btn:hover {
            background-color: #15803d;
        }

        /* Delete */

        .delete-btn {
            background-color: #dc2626;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-size: 14px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        /* Back to notes */

        .back {
            display: inline-block;

            margin-top: 25px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="header">

        <h2>SNM Notes</h2>

    </div>


    <div class="container">

        <div class="note-card">

            <h2 class="note-title">
                {{ note[2] }}
            </h2>


            <p class="note-content">
                {{ note[3] }}
            </p>


            <p class="date-info">
                Created At: {{ note[4] }}
            </p>

            <p class="date-info">
                Updated At: {{ note[5] }}
            </p>


            <div class="actions">

                <!-- Edit Note -->

                <a
                    class="action-link edit-btn"
                    href="{{ url_for('update_note', note_id=note[0]) }}"
                >
                    Edit Note
                </a>


                <!-- Upload File -->

                <a
                    class="action-link upload-btn"
                    href="{{ url_for('upload_file', note_id=note[0]) }}"
                >
                    Upload File
                </a>


                <!-- Delete Note -->

                <form
                    action="{{ url_for('delete_note', note_id=note[0]) }}"
                    method="POST"
                >

                    <button
                        class="delete-btn"
                        type="submit"
                        onclick="return confirm('Are you sure you want to delete this note?')"
                    >
                        Delete Note
                    </button>

                </form>

            </div>


            <!-- Back to Notes -->

            <a
                class="back"
                href="{{ url_for('view_notes') }}"
            >
                ← Back to Notes
            </a>

        </div>

    </div>

</body>

</html>
