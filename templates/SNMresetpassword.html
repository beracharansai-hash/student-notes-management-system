<!DOCTYPE html>
<html>

<head>

    <title>Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background-image:
            linear-gradient(rgba(0, 30, 60, 0.50), rgba(0, 30, 60, 0.50)),
            url("https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        display: flex;
        justify-content: center;
        align-items: center;
    }

        /* Reset password box */

        .reset-container {
            width: 90%;
            max-width: 400px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Heading */

        h2 {
            text-align: center;

            color: #1f2937;

            margin-bottom: 30px;
        }

        /* Label */

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-weight: 500;
        }

        /* Password input */

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* Reset button */

        button {
            width: 100%;

            padding: 12px;

            background-color: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

    </style>

</head>


<body>

    <div class="reset-container">

        <h2>Reset Password</h2>

        <form method="POST">

            <label>
                New Password:
            </label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>

</body>

</html>
