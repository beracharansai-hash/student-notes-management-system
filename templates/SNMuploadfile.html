<!DOCTYPE html>
<html>

<head>

    <title>Upload File</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

          body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background-image:
            linear-gradient(rgba(240, 248, 255, 0.80), rgba(240, 248, 255, 0.80)),
            url("https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

        /* Main container */

        .upload-container {
            width: 90%;
            max-width: 500px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        /* Heading */

        h2 {
            color: #1f2937;

            margin-bottom: 30px;
        }

        /* Label */

        label {
            display: block;

            text-align: left;

            color: #374151;

            font-weight: 500;

            margin-bottom: 10px;
        }

        /* File input */

        input[type="file"] {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background-color: #f9fafb;

            margin-bottom: 25px;

            cursor: pointer;
        }

        /* Upload button */

        button {
            width: 100%;

            padding: 13px;

            background-color: #16a34a;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #15803d;
        }

    </style>

</head>


<body>

    <div class="upload-container">

        <h2>Upload File</h2>


        <form
            action="{{ url_for('upload_file', note_id=note_id) }}"
            method="POST"
            enctype="multipart/form-data"
        >

            <label>
                Select File:
            </label>


            <input
                type="file"
                name="file"
                required
            >


            <button type="submit">
                Upload File
            </button>

        </form>

    </div>

</body>

</html>
