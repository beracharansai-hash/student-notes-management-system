<!DOCTYPE html>
<html>
<head>

    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        /* Remove default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Whole page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation bar */
        nav {
            background-color: #1f2937;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        /* Navigation links */
        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 6px;
            transition: 0.3s;
        }

        /* Hover effect */
        nav a:hover {
            background-color: #374151;
            color: #60a5fa;
        }

        /* Main content */
        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
            flex: 1;
        }

        /* Footer */
        footer {
            background-color: #1f2937;
            color: #d1d5db;
            text-align: center;
            padding: 18px;
            margin-top: auto;
        }

        footer p {
            font-size: 14px;
        }

    </style>

</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
