<!DOCTYPE html>
<html>

<head>

    <title>Update Note</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background-image:
            linear-gradient(rgba(240, 248, 255, 0.80), rgba(240, 248, 255, 0.80)),
            url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

        /* Main container */

        .update-container {
            width: 90%;
            max-width: 650px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Heading */

        h2 {
            text-align: center;

            color: #1f2937;

            margin-bottom: 30px;
        }

        /* Labels */

        label {
            display: block;

            color: #374151;

            font-weight: 500;

            margin-bottom: 8px;
        }

        /* Title */

        input[type="text"] {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            margin-bottom: 22px;
        }

        /* Content */

        textarea {
            width: 100%;

            min-height: 200px;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            font-family: Arial, sans-serif;

            resize: vertical;

            margin-bottom: 22px;
        }

        /* Focus effect */

        input:focus,
        textarea:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* Update button */

        button {
            width: 100%;

            padding: 13px;

            background-color: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Links section */

        .links {
            text-align: center;

            margin-top: 25px;
        }

        .links a {
            display: inline-block;

            margin: 6px 10px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="update-container">

        <h2>Update Note</h2>


        <form method="POST">

            <label>
                Title:
            </label>

            <input
                type="text"
                name="title"
                value="{{ note[2] }}"
                required
            >


            <label>
                Content:
            </label>

            <textarea
                name="content"
                rows="10"
                cols="50"
                required
            >{{ note[3] }}</textarea>


            <button type="submit">
                Update Note
            </button>

        </form>


        <div class="links">

            <a href="{{ url_for('upload_file', note_id=note[0]) }}">
                Upload File
            </a>

            <a href="{{ url_for('view_single_note', note_id=note[0]) }}">
                Back to Note
            </a>

            <a href="{{ url_for('view_notes') }}">
                Back to Notes
            </a>

        </div>

    </div>

</body>

</html>
