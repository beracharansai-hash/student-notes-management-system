<!DOCTYPE html>
<html>

<head>

    <title>My Uploaded Files</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background-image:
            linear-gradient(rgba(240, 248, 255, 0.82), rgba(240, 248, 255, 0.82)),
            url("https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
        /* Header */

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h2 {
            margin: 0;
        }

        /* Main container */

        .container {
            width: 90%;
            max-width: 900px;
            margin: 35px auto;
        }

        /* Page title */

        .page-title {
            color: #1f2937;
            margin-bottom: 25px;
        }

        /* File card */

        .file-card {
            background-color: white;

            padding: 25px;

            margin-bottom: 20px;

            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .file-card p {
            margin-bottom: 12px;
            color: #555;
        }

        .file-card strong {
            color: #1f2937;
        }

        /* Uploaded date */

        .uploaded-date {
            font-size: 13px;
            color: #777 !important;
        }

        /* Buttons */

        .actions {
            margin-top: 20px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            align-items: center;
        }

        .action-link {
            display: inline-block;

            padding: 10px 16px;

            border-radius: 6px;

            text-decoration: none;

            color: white;

            font-size: 14px;
        }

        /* View */

        .view-btn {
            background-color: #2563eb;
        }

        .view-btn:hover {
            background-color: #1d4ed8;
        }

        /* Download */

        .download-btn {
            background-color: #16a34a;
        }

        .download-btn:hover {
            background-color: #15803d;
        }

        /* Excel button */

        .excel-btn {
            background-color: #7c3aed;
        }

        .excel-btn:hover {
            background-color: #6d28d9;
        }

        /* Delete */

        .delete-btn {
            background-color: #dc2626;

            color: white;

            border: none;

            padding: 10px 16px;

            border-radius: 6px;

            font-size: 14px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        /* No files */

        .no-files {
            background-color: white;

            padding: 30px;

            text-align: center;

            border-radius: 10px;

            color: #777;
        }

        /* Back button */

        .back {
            display: inline-block;

            margin-top: 10px;

            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="header">

        <h2>SNM File Management</h2>

    </div>


    <div class="container">

        <h2 class="page-title">
            My Uploaded Files
        </h2>


        {% for file in files %}

        <div class="file-card">

            <p>
                <strong>File Name:</strong>
                {{ file[2] }}
            </p>


            <p>
                <strong>Note:</strong>
                {{ file[5] }}
            </p>


            <p class="uploaded-date">
                <strong>Uploaded At:</strong>
                {{ file[4] }}
            </p>


            <div class="actions">

                <!-- Download files of this particular note -->

                <a
                    class="action-link excel-btn"
                    href="{{ url_for('download_note_files_excel', note_id=file[1]) }}"
                >
                    Download {{ file[5] }} Files as Excel
                </a>


                <!-- View File -->

                <a
                    class="action-link view-btn"
                    href="{{ url_for('view_file', file_id=file[0]) }}"
                >
                    View File
                </a>


                <!-- Download Individual File -->

                <a
                    class="action-link download-btn"
                    href="{{ url_for('download_file', file_id=file[0]) }}"
                >
                    Download File
                </a>


                <!-- Delete File -->

                <form
                    action="{{ url_for('delete_file', file_id=file[0]) }}"
                    method="POST"
                >

                    <button
                        class="delete-btn"
                        type="submit"
                        onclick="return confirm('Are you sure you want to delete this file?')"
                    >
                        Delete File
                    </button>

                </form>

            </div>

        </div>


        {% else %}

        <div class="no-files">

            <p>
                No files uploaded.
            </p>

        </div>

        {% endfor %}


        <a
            class="back"
            href="{{ url_for('dashboard') }}"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
