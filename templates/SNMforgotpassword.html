<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

         body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;

        background-image:
            linear-gradient(rgba(0, 30, 60, 0.50), rgba(0, 30, 60, 0.50)),
            url("https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        display: flex;
        justify-content: center;
        align-items: center;
    }

        /* Forgot password box */

        .forgot-container {
            width: 90%;
            max-width: 400px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Heading */

        h2 {
            text-align: center;

            color: #1f2937;

            margin-bottom: 15px;
        }

        /* Description */

        .description {
            text-align: center;

            color: #666;

            font-size: 14px;

            margin-bottom: 25px;
        }

        /* Label */

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-weight: 500;
        }

        /* Email input */

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* Button */

        button {
            width: 100%;

            padding: 12px;

            background-color: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

    </style>

</head>


<body>

    <div class="forgot-container">

        <h2>Forgot Password</h2>

        <p class="description">
            Enter your email address to reset your password.
        </p>

        <form
            action="/forgot-password"
            method="POST"
        >

            <label>Email:</label>

            <input
                type="email"
                name="email"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

    </div>

</body>

</html>
